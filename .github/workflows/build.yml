name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper jar and caches Gradle dependencies
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build
