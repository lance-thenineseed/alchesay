plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    // Versions for the whole build live here
    implementation 'org.springframework.boot:spring-boot-gradle-plugin:4.1.2'
    implementation 'io.spring.gradle:dependency-management-plugin:1.1.7'
}
